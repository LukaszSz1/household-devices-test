server:
  port: 8080

spring:
  application:
    name: household-devices
  datasource:
    url: jdbc:postgresql://localhost:5432/household_devices
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: false
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
